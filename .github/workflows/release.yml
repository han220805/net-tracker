name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app
        run: bun run desktop:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Net Tracker ${{ github.ref_name }}"
          body: |
            # 🌐 Net Tracker ${{ github.ref_name }}
            > *Monitor lalu lintas internet komputer Anda secara realtime, transparan, dan privat.*

            ---

            ### 📦 Pilihan Download
            | File Installer | Keterangan | Rekomendasi |
            |---|---|---|
            | `net-tracker_*_x64-setup.exe` | Installer wizard praktis (NSIS) | ⭐ **Sangat Disarankan** (Membuat shortcut di Desktop & Start Menu) |
            | `net-tracker_*_x64_en-US.msi` | Windows Installer Package (MSI) | Cocok untuk instalasi silent / lingkungan korporat |

            ---

            ### 🚀 Langkah Cepat Instalasi
            1. Unduh file `net-tracker_*_x64-setup.exe` pada daftar **Assets** di bawah.
            2. Jalankan installer dan ikuti instruksi di layar hingga selesai.
            3. Buka **Net Tracker** dari Desktop atau menu Start.

            ---

            ### ✨ Fitur Unggulan Versi Ini
            - ⚡ **Realtime Monitor**: Pantau koneksi per aplikasi, DNS remote host, status soket, dan kecepatan download/upload per detik.
            - 📈 **Grafik Bandwidth**: Visualisasi kurva lonjakan traffic jaringan secara realtime.
            - 📜 **History & Forensik**: Seluruh riwayat koneksi tersimpan di database lokal SQLite tanpa upload ke server luar.
            - 🧹 **Auto-Cleanup & Retensi**: Atur masa simpan log history dari 7 hari hingga selamanya.
            - 🎨 **Dark & Light Mode**: Desain modern, frameless, dan nyaman di mata.

            ---

            ### 💻 Kebutuhan Sistem
            - Windows 10 atau Windows 11 (64-bit)
            - Runtime WebView2 sudah diikutsertakan (Offline Installer)
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/updater/*
